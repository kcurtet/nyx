# nyx — configuración
# Se crea la primera vez en ~/.config/nyx/config.toml (Windows: %APPDATA%\nyx\config.toml).
# Las rutas viejas de jerga se migran solas al primer arranque (backup config.toml.pre-nyx).
# `nyx config` te dice la ruta. Reinicia nyx tras editar.

[hotkey]
# Nombre de la tecla (pulsa teclas con `nyx keys` para ver su nombre).
# Ej.: KEY_RIGHTCTRL, KEY_RIGHTALT, KEY_F12, KEY_PAUSE, KEY_SCROLLLOCK, KEY_CAPSLOCK
key = "KEY_RIGHTCTRL"
# "hold": mantener pulsada para grabar, soltar para transcribir.
#         Si pulsas otra tecla mientras la mantienes, se cancela (era un atajo).
# "toggle": una pulsación empieza, otra termina.
mode = "hold"
min_seconds = 0.35          # grabaciones más cortas se descartan

[stt]
model = "large-v3-turbo"    # o "large-v3" (más lento, algo más preciso)
device = "auto"             # auto | cuda | cpu
compute_type = "auto"       # auto → float16 en GPU, int8 en CPU
# Sin GPU, si va lento: model = "small" o "medium"
language = "es"
beam_size = 5
# Vocabulario que Whisper debe "esperar". Se mete en el prompt inicial.
# Escríbelo como quieres que aparezca (mayúsculas incluidas).
vocabulary = [
  "git", "git push", "git pull", "git commit", "git rebase", "git merge", "git stash",
  "GitHub", "pull request", "PR", "branch", "main", "checkout", "cherry-pick",
  "Docker", "docker compose", "Dockerfile", "Kubernetes", "kubectl", "Helm",
  "deploy", "build", "pipeline", "CI/CD", "staging", "frontend", "backend",
  "TypeScript", "JavaScript", "Python", "Rust", "React", "Next.js", "Node",
  "npm", "pnpm", "uv", "API", "endpoint", "JSON", "YAML", "TOML", "README",
  "refactor", "debug", "bug", "fix", "test", "commit", "issue", "Ollama", "llama.cpp",
  "pi", "Claude", "prompt", "LLM", "Linux", "Wayland", "KDE", "systray",
  # Símbolos hablados de los comandos «ruta» / «vim» / «programar» (ver [commands])
  "ruta", "tilde", "barra", "contrabarra", "barra invertida", "punto", "guion",
  "guion bajo", "bajo", "dos puntos", "espacio", "arroba",
  "vim", "modo vim", "borrar línea", "guardar", "buscar", "deshacer",
  "programar", "modo programar", "es igual a", "entre comillas", "cierra comillas",
  "punto y coma", "más", "por", "por ciento", "guion", "uno", "dos", "tres",
]

# Correcciones exactas (sin distinguir mayúsculas, por palabra completa).
# Añade aquí los errores que veas repetirse.
[replacements]
"hit push" = "git push"
"hit pull" = "git pull"
"guit" = "git"
"guijab" = "GitHub"
"git hub" = "GitHub"
"dóquer" = "Docker"
"doquer" = "Docker"
"docker con pose" = "docker compose"
"cubernetis" = "Kubernetes"
"pul request" = "pull request"
"pool request" = "pull request"
"sistray" = "systray"
"sis tray" = "systray"

[commands]
# Palabras que no se escriben, sino que hacen algo. Se ignoran tildes y mayúsculas.
# Al final de la frase (se pueden encadenar: "…interrogante envía"):
#   "has hecho el push interrogante"   →  ¿Has hecho el push?
#   "ya pasa el build exclamación"     →  ¡Ya pasa el build!
#   "hola mundo entre comillas"        →  "hola mundo"
#   "pon commit KX en minúsculas"     →  pon commit kx (la palabra anterior)
#   "revisa los logs envía"            →  pega y pulsa Enter
#   "… borra eso"                      →  no pega nada
# Al principio:  "código git status"   →  `git status`
#                "ruta tilde barra dev barra vigia barra docs barra apuntes punto md"
#                                  →  ~/dev/vigia/docs/apuntes.md
#   Símbolos de «ruta»: tilde ~ · barra / · contrabarra \ barra invertida \ · punto .
#                       guion - · guion bajo/bajo _ · dos puntos : · arroba @ ·
#                       espacio → un espacio real (el resto se pega SIN espacios)
#                "modo vim borrar línea"  →  pulsa Esc d d en la ventana con foco
#                "modo programar const a es igual a entre comillas hola cierra comillas punto y coma"
#                                  →  const a = "hola";
# En medio:      "nueva línea", "punto y aparte"
# Para desactivar uno, déjalo vacío: send_words = []
question_words = ["interrogante", "signo de interrogación"]
exclamation_words = ["exclamación", "signo de exclamación", "punto de exclamación"]
spanish_open_marks = true   # añadir "¿" / "¡" al principio
quote_words = ["entre comillas"]
lowercase_words = ["en minúsculas", "minúsculas"]
send_words = ["envía", "enviar"]
discard_words = ["borra eso", "bórralo"]
code_words = ["código"]
path_words = ["ruta"]
newline_words = ["nueva línea", "salto de línea"]
paragraph_words = ["punto y aparte"]

# «vim»: frase → secuencia de teclas para la ventana CON FOCO (nvim, terminales, editores).
# TODAS las secuencias empiezan con esc (salva desde insert/command mode). Los comandos
# "abiertos" (buscar, línea de comando) dejan a nvim esperando: dictas el resto después.
# Tokens: letra, dígito o enter esc semicolon dot slash colon backspace tab space
#         left right up down home end delete insert pageup pagedown; combos con +: ctrl+r.
# / y : NO son inyectables como texto: usa los lógicos slash/colon (vim_layout los resuelve).
vim_words = ["vim", "modo vim"]
vim_layout = "us"   # "us" o "es": cómo se escriben / y : en tu teclado FÍSICO
# «programar»: código de una línea con símbolos hablados. Comillas a TOGGLE EXPLÍCITO
# («entre comillas» abre, «cierra comillas» cierra; sin cierre queda abierta),
# números en dígitos y multi-palabra primero («dos puntos» gana a «dos»).
code_line_words = ["programar", "modo programar"]
# Amplía o redefine vim_map (se MERGE con el mapa de serie; tus frases ganan):
[commands.vim_map]
"insertar al final" = "esc shift+s"   # redefinida (mayúscula = shift+letra, no letra suelta)
"duplicar línea" = "esc y y p"        # añadida (yy + p)

[orders]
# Órdenes por voz: «Nyx, …» no se pega; va a una orquestadora (pi) que maneja tus
# repos, terminales y agentes, y responde en voz alta.
wake_words = ["nyx"]
# Dónde vive la orquestadora:
#   "herdr"   su propio workspace de herdr (la ves trabajar y vigila tus agentes)
#   "pi"      en segundo plano, dentro del servicio de nyx
#   "efimero" nada encendido: cada orden arranca pi, responde en voz alta y muere.
#              La memoria vive en el fichero de sesión (sesión nueva cada día, y a mano
#              con «Sesión nueva» en el menú Nyx del icono de bandeja).
#   "auto"    (por defecto) herdr si puede; si no, pi en segundo plano.
# backend = "efimero"

[llm]
# Segunda pasada con un LLM local que corrige SOLO términos técnicos.
# Añade ~0.3-1 s de latencia. Actívalo si los reemplazos no bastan.
enabled = false
url = "http://localhost:11434"   # Ollama
model = "qwen2.5:3b"
timeout = 4.0

[output]
# "paste": copia al portapapeles y pulsa paste_keys (rápido, soporta tildes/ñ).
# "type": teclea con ydotool (lento, sin tildes fiables).
# "clipboard": solo copia, tú pegas.
method = "paste"
# Tecla de pegar. Por defecto: shift+insert en Linux (terminales y apps), ctrl+v en Windows.
# paste_keys = "ctrl+shift+v"
restore_clipboard = true
trailing_space = true
strip_final_period = false

[tts]
# Leer en voz alta: selecciona texto y pulsa la tecla (otra vez = callar).
# También: nyx say "texto" · echo "texto" | nyx say · nyx hush
enabled = true
key = "ctrl+0"                 # ej.: "ctrl+0", "ctrl+alt+r", "KEY_F9"  · también por voz: «léeme esto» / «calla»
voice = "Nerea"                # voces de phonon: Nerea, Alicia, Celia, Noa, Candela… (es-ES) · Regina, Ximena… (es-MX)
model = "hf://gradium/phonon-40m-es"
quant = "q8_0"
max_chars = 4000

# Cómo debe sonar cada término. Se aplica antes de leer (sin distinguir mayúsculas).
# Lo que pongas aquí se suma a los de serie; para quitar uno, mapéalo a sí mismo.
[tts.lexicon]
# "git" = "guit"
# "kubectl" = "kiub ci ti el"
# "el CI/CD" = "la integración continua"
# "YAML" = "yámal"
# "pipeline" = "paip-láin"

[ui]
# auto | gtk (Wayland: KDE/Sway/Hyprland) | tk (Windows/X11/GNOME) | none
backend = "auto"
