[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jerga"
version = "0.4.0"
description = "Dictado push-to-talk local que entiende tu jerga técnica: habla español, di git push."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["dictation", "speech-to-text", "whisper", "spanish", "push-to-talk", "wayland"]
dependencies = [
  "faster-whisper>=1.1",
  "sounddevice>=0.4",
  "numpy",
  "httpx",
  "ptts>=0.6",  # voz (phonon): wheels para Linux, Windows y macOS
  "pystray>=0.19",  # icono de bandeja
  "pillow",
  "tomli>=2; python_version < '3.11'",
  # En Linux se usa el paquete de la distro (python3-evdev) vía --system-site-packages;
  # si no está, pip lo compila (necesita gcc + cabeceras del kernel).
  "evdev>=1.6; sys_platform == 'linux'",
  "pynput>=1.7; sys_platform == 'win32'",
  "pyperclip>=1.8; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Librerías CUDA 12 para faster-whisper/ctranslate2 en GPU NVIDIA.
cuda = [
  "nvidia-cublas-cu12; sys_platform != 'darwin'",
  "nvidia-cudnn-cu12>=9,<10; sys_platform != 'darwin'",
]

[project.scripts]
jerga = "jerga.app:main"

[project.gui-scripts]
# En Windows arranca sin ventana de consola (para el inicio automático).
jerga-gui = "jerga.app:main"

[project.urls]
Homepage = "https://github.com/kcurtet/jerga"

[tool.hatch.build.targets.wheel]
packages = ["jerga"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# errores, avisos, pyflakes, orden de imports, bugbear
select = ["E", "W", "F", "I", "B"]
ignore = [
  "E501",  # líneas largas: las decide el formato de cada caso
  "B008",  # llamadas en defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "B011"]  # imports a mitad de fichero en tests agrupados por tema

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
